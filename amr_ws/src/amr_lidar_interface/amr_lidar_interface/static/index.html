<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Lidar Interface</title>
  <style>
    :root {
      --bg: #eceff3;
      --panel: #ffffff;
      --ink: #111827;
      --muted: #5b6472;
      --line: #d5dbe4;
      --yellow: #ffc700;
      --yellow-shadow: #c99a00;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #2563eb;
      --canvas: #101826;
      --font: Arial, Helvetica, sans-serif;
      --mono: "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      padding: 24px;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      font-size: 1.8rem;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 38px;
      padding: 9px 14px;
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 3px 0 var(--line);
      font-weight: 800;
      white-space: nowrap;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--red);
    }

    .status-pill.ok .dot {
      background: var(--green);
      animation: pulse 1.6s infinite;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 22px;
      align-items: start;
    }

    .viewer {
      background: var(--panel);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 5px 0 var(--line);
    }

    .canvas-wrap {
      width: 100%;
      min-height: 360px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 2px solid #1f2937;
      border-radius: 8px;
      background: var(--canvas);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .metrics {
      display: grid;
      gap: 13px;
    }

    .metric {
      padding: 15px;
      border-radius: 8px;
      background: var(--yellow);
      box-shadow: 0 4px 0 var(--yellow-shadow);
    }

    .metric-label {
      color: var(--muted);
      font-size: .76rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 5px;
      font-family: var(--mono);
      font-size: 1.05rem;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .api-link {
      display: block;
      padding: 13px 15px;
      border-radius: 8px;
      background: var(--panel);
      color: var(--blue);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 3px 0 var(--line);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .45); }
      50% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
    }

    @media (max-width: 850px) {
      body { padding: 16px; }
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .canvas-wrap { min-height: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>AMR Lidar Interface</h1>
      <div class="subtitle">SLLidar S2 live scan viewer</div>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot"></span>
      <span id="statusText">Menunggu /scan</span>
    </div>
  </header>

  <div class="layout">
    <main class="viewer">
      <div class="canvas-wrap">
        <canvas id="scanCanvas"></canvas>
      </div>
    </main>

    <aside class="metrics">
      <div class="metric">
        <div class="metric-label">Topic</div>
        <div class="metric-value" id="topic">scan</div>
      </div>
      <div class="metric">
        <div class="metric-label">Frame</div>
        <div class="metric-value" id="frame">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Point</div>
        <div class="metric-value" id="points">0 / 0</div>
      </div>
      <div class="metric">
        <div class="metric-label">Range</div>
        <div class="metric-value" id="range">-</div>
      </div>
      <div class="metric">
        <div class="metric-label">Update</div>
        <div class="metric-value" id="updateTime">-</div>
      </div>
      <a class="api-link" href="/api/lidar/scan">API JSON</a>
    </aside>
  </div>

  <script>
    const canvas = document.getElementById('scanCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return rect;
    }

    function setStatus(connected) {
      const pill = document.getElementById('statusPill');
      const text = document.getElementById('statusText');
      pill.className = `status-pill ${connected ? 'ok' : ''}`;
      text.textContent = connected ? 'Connected' : 'Disconnected';
    }

    function drawGrid(width, height, maxRange) {
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) * 0.44;

      ctx.fillStyle = '#101826';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(148, 163, 184, .24)';
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, radius * i / 4, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.moveTo(cx, cy - radius);
      ctx.lineTo(cx, cy + radius);
      ctx.moveTo(cx - radius, cy);
      ctx.lineTo(cx + radius, cy);
      ctx.stroke();

      ctx.fillStyle = 'rgba(229, 231, 235, .8)';
      ctx.font = '12px Courier New, monospace';
      ctx.fillText(`${maxRange.toFixed(1)} m`, cx + 8, cy - radius + 16);
    }

    function drawScan(data) {
      const rect = resizeCanvas();
      const width = rect.width;
      const height = rect.height;
      const cx = width / 2;
      const cy = height / 2;
      const maxRange = Math.max(Number(data.range_max) || 8, 1);
      const scale = Math.min(width, height) * 0.44 / maxRange;

      drawGrid(width, height, maxRange);

      ctx.fillStyle = '#22c55e';
      for (const point of data.points || []) {
        const x = cx + Math.cos(point.a) * point.r * scale;
        const y = cy - Math.sin(point.a) * point.r * scale;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateMetrics(data) {
      document.getElementById('topic').textContent = data.topic || 'scan';
      document.getElementById('frame').textContent = data.frame_id || '-';
      document.getElementById('points').textContent =
        `${data.valid_count || 0} / ${data.total_count || 0}`;
      document.getElementById('range').textContent =
        `${Number(data.range_min || 0).toFixed(2)} - ${Number(data.range_max || 0).toFixed(2)} m`;
      document.getElementById('updateTime').textContent =
        new Date().toLocaleTimeString('id-ID');
    }

    async function fetchScan() {
      try {
        const res = await fetch('/api/lidar/scan');
        const data = await res.json();
        setStatus(Boolean(data.connected));
        updateMetrics(data);
        drawScan(data);
      } catch (err) {
        console.error(err);
        setStatus(false);
      }
    }

    window.addEventListener('resize', fetchScan);
    fetchScan();
    setInterval(fetchScan, 200);
  </script>
</body>
</html>
